<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINISTER ARCADE // v2.1</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  SINISTER ARCADE  ·  v2.1  ·  Sinister Division               ║
  ║  Single-file emulator frontend.                              ║
  ║  Systems: NES · SNES · Genesis · Arcade · Game Boy (GB/GBC/GBA)║
  ║  + Sinister Originals (self-hosted first-party titles)        ║
  ║                                                              ║
  ║  ADD GAMES: scroll to the DB block in <script> and drop a    ║
  ║  new { title, description, url } into the right system array. ║
  ║  COVERS ARE AUTOMATIC: pulled from archive.org/services/img/ ║
  ║  using the identifier in each game's url. Missing/blocked    ║
  ║  covers fall back to the system emoji. Originals: add an     ║
  ║  optional `cover:'url'` field or they keep their emoji art.  ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Sinister palette ── */
  --void:#08070b;
  --crypt:#100d16;
  --panel:#16121f;
  --panel-2:#1c1726;
  --blood:#8f0d16;
  --blood-lit:#e01e28;
  --gold:#c8a84a;
  --gold-lit:#f0d27a;
  --cyan:#00e5ff;
  --bone:#e9e3d3;
  --ash:#8a8074;
  --ember:#ff6a2b;
  --line:rgba(200,168,74,.18);
  --cabinet-art:none; /* drop url('yourart.jpg') here to restore a photo backdrop */

  --f-goth:'Pirata One', serif;
  --f-pixel:'Press Start 2P', cursive;
  --f-term:'VT323', monospace;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--f-term);
  color:var(--bone);
  background:var(--void);
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}

/* ── Atmosphere: fog, ember glow, grid, vignette (CSS, no image) ── */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-art{background:var(--cabinet-art);background-size:cover;background-position:center;opacity:.25;filter:grayscale(.4) contrast(1.1)}
.bg-fog{
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(143,13,22,.28), transparent 60%),
    radial-gradient(1000px 800px at 100% 110%, rgba(0,229,255,.10), transparent 55%),
    radial-gradient(700px 500px at 50% 40%, rgba(200,168,74,.06), transparent 70%),
    linear-gradient(180deg,#0a0810 0%, #08070b 60%, #050409 100%);
}
.bg-grid{
  background-image:
    linear-gradient(rgba(200,168,74,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,168,74,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 30%, #000 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 30%, #000 30%, transparent 80%);
}
.bg-vignette{box-shadow:inset 0 0 260px 60px rgba(0,0,0,.9)}
.bg-scan{
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;z-index:9999
}
.bg-flicker{background:rgba(0,229,255,.02);z-index:9998;animation:flick 6s infinite steps(1)}
@keyframes flick{0%,97%{opacity:0}98%{opacity:.6}99%{opacity:0}100%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.bg-flicker{animation:none}}

/* ── Shell ── */
.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:26px 22px 90px}

/* ── Marquee (the signature) ── */
.marquee{position:relative;text-align:center;padding:30px 10px 26px;margin-bottom:26px}
.marquee::before{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(680px,92%);height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--blood-lit),var(--gold),transparent);
  box-shadow:0 0 22px var(--gold);
}
.marquee .kicker{
  font-family:var(--f-pixel);font-size:.52rem;letter-spacing:.42em;color:var(--cyan);
  text-shadow:0 0 12px rgba(0,229,255,.7);margin-bottom:14px;padding-left:.42em
}
.marquee h1{
  font-family:var(--f-goth);font-weight:400;line-height:.92;
  font-size:clamp(3rem,10vw,6.4rem);letter-spacing:.02em;
  color:var(--bone);
  text-shadow:
    0 0 4px #fff,
    0 0 22px var(--blood-lit),
    0 0 46px var(--blood),
    0 2px 0 #2a0407;
  animation:buzz 5s infinite;
}
.marquee h1 .div{display:block;font-size:.5em;color:var(--gold);text-shadow:0 0 18px var(--gold);letter-spacing:.06em;margin-top:.1em}
@keyframes buzz{0%,94%,100%{opacity:1}95%{opacity:.72}96%{opacity:1}97%{opacity:.5}98%{opacity:1}}
@media (prefers-reduced-motion:reduce){.marquee h1{animation:none}}
.marquee .est{font-family:var(--f-term);font-size:1.15rem;color:var(--ash);letter-spacing:.35em;margin-top:12px}

/* ── Section headers ── */
.sec-head{display:flex;align-items:center;gap:16px;margin:34px 2px 18px}
.sec-head .tag{font-family:var(--f-pixel);font-size:.6rem;letter-spacing:.2em;color:var(--gold);white-space:nowrap;text-shadow:0 0 10px rgba(200,168,74,.4)}
.sec-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-head .hint{font-size:1rem;color:var(--ash);letter-spacing:.08em}

/* ══ SINISTER ORIGINALS — first-party shelf (the crescendo) ══ */
#originals{
  position:relative;border:1px solid rgba(143,13,22,.5);border-radius:10px;
  background:
    radial-gradient(600px 200px at 20% 0%, rgba(143,13,22,.22), transparent 70%),
    linear-gradient(180deg, var(--panel-2), var(--crypt));
  padding:20px 20px 24px;box-shadow:0 0 40px rgba(143,13,22,.18), inset 0 1px 0 rgba(240,210,122,.12);
}
#originals .seal{
  position:absolute;top:-11px;left:22px;background:var(--void);
  font-family:var(--f-pixel);font-size:.5rem;letter-spacing:.22em;color:var(--gold-lit);
  padding:4px 12px;border:1px solid var(--gold);border-radius:20px;
  text-shadow:0 0 8px var(--gold);box-shadow:0 0 18px rgba(200,168,74,.25)
}
.orig-rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:8px}
.orig-card{
  position:relative;border:1px solid rgba(200,168,74,.28);border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,#1d1622,#120d18);cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.orig-card:hover,.orig-card:focus-visible{transform:translateY(-4px);border-color:var(--gold-lit);
  box-shadow:0 10px 30px rgba(0,0,0,.55), 0 0 26px rgba(200,168,74,.28);outline:none}
.orig-card .art{position:relative;height:118px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;overflow:hidden;
  background:radial-gradient(120px 80px at 50% 30%, rgba(143,13,22,.4), transparent), #0d0a12;
  border-bottom:1px solid rgba(200,168,74,.2);text-shadow:0 0 20px rgba(224,30,40,.6);filter:saturate(1.1)}
.orig-card .art .orig-cover{width:100%;height:100%;object-fit:cover;display:block}
.orig-card.has-cover .art{height:auto;aspect-ratio:3/4}  /* real box-art poster, not a cropped strip */
.orig-card .meta{padding:12px 14px 14px}
.orig-card .t{font-family:var(--f-pixel);font-size:.62rem;color:var(--bone);line-height:1.5;margin-bottom:8px}
.orig-card .d{font-size:1rem;color:var(--ash);line-height:1.15;letter-spacing:.02em}
.orig-card .badge{position:absolute;top:8px;right:8px;font-family:var(--f-pixel);font-size:.42rem;
  color:var(--void);background:var(--gold);padding:3px 6px;border-radius:3px;letter-spacing:.1em;z-index:2}
.orig-card.soon{opacity:.6;cursor:default}
.orig-card.soon:hover{transform:none;box-shadow:none;border-color:rgba(200,168,74,.28)}
.orig-card.soon .badge{background:var(--ash)}

/* ══ SYSTEM SELECT — cartridge tiles ══ */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.cart{
  position:relative;cursor:pointer;border-radius:6px 6px 8px 8px;overflow:hidden;
  background:linear-gradient(180deg,#211a2c 0%,#181321 46%,#120e19 100%);
  border:1px solid rgba(200,168,74,.16);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  --tint:var(--cyan);
}
.cart::before{ /* label sticker */
  content:"";position:absolute;inset:10px 10px auto 10px;height:52px;border-radius:3px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.25));
  border:1px solid rgba(255,255,255,.08)
}
.cart::after{ /* connector notch */
  content:"";position:absolute;left:22%;right:22%;bottom:0;height:9px;border-radius:2px 2px 0 0;
  background:repeating-linear-gradient(90deg,#0c0a10 0 4px, #2a2233 4px 8px)
}
.cart:hover,.cart:focus-visible{transform:translateY(-5px);border-color:var(--tint);
  box-shadow:0 12px 26px rgba(0,0,0,.5), 0 0 24px color-mix(in srgb,var(--tint) 45%, transparent);outline:none}
.cart .ic{position:relative;text-align:center;font-size:2.1rem;padding:22px 0 6px;
  filter:drop-shadow(0 0 12px color-mix(in srgb,var(--tint) 70%, transparent))}
.cart .nm{position:relative;text-align:center;font-family:var(--f-pixel);font-size:.56rem;color:var(--bone);padding:14px 6px 34px;letter-spacing:.06em}
.cart .ct{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.95rem;color:var(--ash);letter-spacing:.12em}

/* ══ GAME LIBRARY ══ */
#library{display:none}
#library.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lib-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 2px 16px}
.btn{
  font-family:var(--f-pixel);font-size:.56rem;letter-spacing:.08em;cursor:pointer;
  color:var(--bone);background:var(--panel);border:1px solid var(--line);
  padding:11px 15px;border-radius:5px;transition:.15s;text-transform:uppercase
}
.btn:hover,.btn:focus-visible{border-color:var(--gold);color:var(--gold-lit);box-shadow:0 0 16px rgba(200,168,74,.25);outline:none}
.lib-title{font-family:var(--f-goth);font-size:2rem;color:var(--gold-lit);letter-spacing:.03em;text-shadow:0 0 18px rgba(200,168,74,.4)}
.lib-count{font-size:1rem;color:var(--ash);letter-spacing:.1em;margin-left:auto}

/* platform tabs (Game Boy family) */
.tabs{display:none;gap:8px;margin:0 2px 14px}
.tabs.show{display:flex}
.tab{font-family:var(--f-pixel);font-size:.5rem;letter-spacing:.1em;padding:8px 12px;border-radius:4px;cursor:pointer;
  color:var(--ash);background:var(--panel);border:1px solid var(--line);transition:.15s}
.tab.on{color:var(--void);background:var(--gold);border-color:var(--gold)}
.tab:hover:not(.on){color:var(--gold-lit);border-color:var(--gold)}

/* ── poster grid: covers, not names ── */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:14px}
.game{
  position:relative;cursor:pointer;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--crypt));
  border:1px solid var(--line);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s;
}
.game:hover,.game.sel{border-color:var(--cyan);
  box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 20px rgba(0,229,255,.16);transform:translateY(-4px)}
.game.fav{border-color:rgba(200,168,74,.5)}
.game.fav:hover,.game.fav.sel{border-color:var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 20px rgba(200,168,74,.2)}

.game .cover{position:relative;aspect-ratio:1/1;background:#0d0a12;overflow:hidden;border-bottom:1px solid var(--line)}
.game .cover-img{width:100%;height:100%;object-fit:cover;display:block;background:#0d0a12;filter:saturate(1.05) contrast(1.03)}
.game .cover.noimg .cover-img{display:none}
.game .cover-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:radial-gradient(120px 90px at 50% 35%, rgba(143,13,22,.35), transparent), #0d0a12}
.game .cover.noimg .cover-fallback{display:flex}
.game .cover-fallback .fi{font-size:3rem;opacity:.6;filter:drop-shadow(0 0 14px rgba(224,30,40,.5))}

.game .star{position:absolute;top:6px;left:7px;z-index:2;font-size:1.3rem;color:var(--gold);line-height:1;cursor:pointer;
  transition:transform .12s;text-shadow:0 1px 4px rgba(0,0,0,.95)}
.game .star:hover{transform:scale(1.25)}
.game .plat{position:absolute;top:7px;right:7px;z-index:2;font-family:var(--f-pixel);font-size:.4rem;color:var(--bone);
  background:rgba(10,8,14,.82);border:1px solid var(--line);padding:3px 5px;border-radius:3px;letter-spacing:.06em}

.game .info{padding:9px 10px 11px}
.game .gt{font-family:var(--f-pixel);font-size:.5rem;color:var(--bone);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}

.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--ash)}
.empty .big{font-family:var(--f-goth);font-size:2rem;color:var(--blood-lit);margin-bottom:10px;text-shadow:0 0 16px rgba(224,30,40,.4)}
.empty .sub{font-size:1.1rem;letter-spacing:.04em}

/* ══ GAME SCREEN — CRT cabinet ══ */
#screen{display:none;position:fixed;inset:0;z-index:500;background:#000}
#screen.active{display:block}
#screen .bezel{position:absolute;inset:0;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 120px 30px rgba(0,0,0,.85), inset 0 0 0 2px rgba(200,168,74,.25)}
#screen .bezel::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);opacity:.4}
#gameFrame{width:100%;height:100%;border:none;background:#000;position:relative;z-index:1}
.hud{position:absolute;z-index:5;font-family:var(--f-pixel);font-size:.52rem;letter-spacing:.06em}
.hud.back{top:14px;left:14px;color:var(--bone);background:rgba(10,8,14,.82);border:1px solid var(--gold);
  padding:10px 13px;border-radius:5px;cursor:pointer;text-shadow:0 0 8px rgba(200,168,74,.4)}
.hud.back:hover{color:var(--gold-lit);box-shadow:0 0 16px rgba(200,168,74,.35)}
.hud.ctrl{top:14px;right:14px;color:var(--cyan);background:rgba(10,8,14,.82);border:1px solid var(--cyan);
  padding:10px 13px;border-radius:5px;cursor:pointer}
.hud.ctrl:hover{box-shadow:0 0 16px rgba(0,229,255,.35)}

/* ══ CONTROLS OVERLAY (cheat-sheet) ══ */
#controls{position:fixed;inset:0;z-index:800;display:none;align-items:center;justify-content:center;
  background:rgba(4,3,7,.86);backdrop-filter:blur(3px)}
#controls.show{display:flex;animation:fade .2s ease}
.ctrl-box{width:min(560px,92%);max-height:84vh;overflow:auto;background:linear-gradient(180deg,var(--panel-2),var(--crypt));
  border:1px solid var(--gold);border-radius:10px;padding:26px 26px 20px;box-shadow:0 0 60px rgba(0,0,0,.7), 0 0 30px rgba(200,168,74,.2)}
.ctrl-box h2{font-family:var(--f-goth);font-size:1.9rem;color:var(--gold-lit);letter-spacing:.03em;margin-bottom:16px;text-align:center;text-shadow:0 0 16px rgba(200,168,74,.4)}
.cseg{border-left:2px solid var(--blood);padding:2px 0 2px 14px;margin-bottom:14px}
.cseg .lbl{font-family:var(--f-pixel);font-size:.5rem;color:var(--cyan);letter-spacing:.08em;margin-bottom:7px;text-shadow:0 0 8px rgba(0,229,255,.4)}
.cseg .txt{font-size:1.12rem;color:var(--bone);line-height:1.35;letter-spacing:.02em}
.cseg .txt b{color:var(--gold-lit)}
.ctrl-close{display:block;margin:6px auto 0;font-family:var(--f-pixel);font-size:.54rem;color:var(--void);
  background:var(--gold);border:none;padding:12px 22px;border-radius:5px;cursor:pointer;letter-spacing:.08em}
.ctrl-close:hover{background:var(--gold-lit)}

footer{text-align:center;color:var(--ash);font-size:1rem;letter-spacing:.18em;margin-top:44px;opacity:.7}
footer .v{color:var(--gold)}

@media (max-width:560px){
  .marquee h1{font-size:clamp(2.4rem,13vw,3.4rem)}
  .games{grid-template-columns:repeat(2,1fr)}
  .lib-count{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="bg-layer bg-art"></div>
<div class="bg-layer bg-fog"></div>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-vignette"></div>
<div class="bg-layer bg-scan"></div>
<div class="bg-layer bg-flicker"></div>

<div class="shell" id="home">
  <header class="marquee">
    <div class="kicker">INSERT SOUL · SELECT SYSTEM</div>
    <h1>Sinister Arcade<span class="div">◈ SINISTER DIVISION ◈</span></h1>
    <div class="est">EST. IN THE DARK</div>
  </header>

  <!-- ── SINISTER ORIGINALS ── -->
  <div class="sec-head">
    <span class="tag">◆ SINISTER ORIGINALS</span>
    <span class="rule"></span>
    <span class="hint">first-party · built in-house</span>
  </div>
  <section id="originals">
    <span class="seal">MADE BY SINISTER DIVISION</span>
    <div class="orig-rail" id="origRail"></div>
  </section>

  <!-- ── SYSTEM SELECT ── -->
  <div class="sec-head">
    <span class="tag">▸ SELECT SYSTEM</span>
    <span class="rule"></span>
    <span class="hint">emulated via archive.org</span>
  </div>
  <section class="sys-grid" id="sysGrid"></section>

  <footer>SINISTER ARCADE <span class="v">v2.1</span> · A SINISTER DIVISION JOINT</footer>
</div>

<!-- ── GAME LIBRARY ── -->
<div class="shell" id="library">
  <div class="lib-bar">
    <button class="btn" onclick="backToSystems()">◀ SYSTEMS</button>
    <span class="lib-title" id="libTitle">SYSTEM</span>
    <span class="lib-count" id="libCount"></span>
  </div>
  <div class="tabs" id="platTabs"></div>
  <div class="games" id="gamesGrid"></div>
</div>

<!-- ── GAME SCREEN ── -->
<div id="screen">
  <div class="bezel"></div>
  <div class="hud back" onclick="exitGame()">◀ MENU · [ESC]</div>
  <div class="hud ctrl" onclick="openControls(currentSystem)">🎮 CONTROLS</div>
  <iframe id="gameFrame" allow="autoplay; fullscreen; clipboard-read; clipboard-write; gamepad"
          allowfullscreen sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>
</div>

<!-- ── CONTROLS OVERLAY ── -->
<div id="controls">
  <div class="ctrl-box">
    <h2 id="ctrlTitle">CONTROLS</h2>
    <div id="ctrlBody"></div>
    <button class="ctrl-close" onclick="closeControls()">CLOSE · [ESC]</button>
  </div>
</div>

<script>
/* ================================================================
   SINISTER ARCADE v2.1 — data + logic
   ================================================================ */

/* ---- shared control cheat-sheets (documentation only) ---- */
const C = {
  activate:{lbl:'⚠ FIRST — WAKE THE GAME', txt:'Click inside the screen so it takes focus. Keys do nothing until you do.'},
  coins:{lbl:'🪙 ARCADE MODE', txt:'<b>5</b> insert coin · <b>1</b> start P1 · <b>2</b> start P2'},
};
const CTRL = {
  nes:[C.activate,
    {lbl:'🕹 MOVEMENT', txt:'Arrow keys = D-Pad'},
    {lbl:'🎮 BUTTONS', txt:'<b>Z / Ctrl</b> = A · <b>X / Alt</b> = B · <b>Enter</b> = Start · <b>Shift</b> = Select'},
    C.coins],
  snes:[C.activate,
    {lbl:'🕹 MOVEMENT', txt:'Arrow keys = D-Pad'},
    {lbl:'🎮 FACE BUTTONS', txt:'<b>Z</b>=B · <b>X</b>=A · <b>A</b>=Y · <b>S</b>=X'},
    {lbl:'🎯 SHOULDERS', txt:'<b>Q</b>=L · <b>W</b>=R'},
    {lbl:'⏯ MENU', txt:'<b>Enter</b>=Start · <b>Shift</b>=Select'},
    C.coins],
  genesis:[C.activate,
    {lbl:'🕹 MOVEMENT', txt:'Arrow keys = D-Pad'},
    {lbl:'⚡ BUTTONS', txt:'<b>A</b>=A · <b>S</b>=B · <b>D</b>=C · <b>Z X C</b>=X Y Z (6-button)'},
    {lbl:'⏯ START', txt:'<b>Enter</b> = Start'},
    C.coins],
  arcade:[C.activate,
    {lbl:'🕹 JOYSTICK', txt:'Arrow keys'},
    {lbl:'🎮 BUTTONS', txt:'<b>Ctrl · Alt · Space · Shift</b> = buttons 1–4'},
    {lbl:'🪙 COIN & START', txt:'<b>5</b> insert coin · <b>1</b> start · Some games: <b>Tab</b> opens the emulator menu'}],
  pc:[C.activate,
    {lbl:'🖱 MOUSE', txt:'Move + click inside the screen. Many DOS/Win games are mouse-driven.'},
    {lbl:'⌨ KEYBOARD', txt:'Full keyboard passes through. <b>Ctrl+F12</b> may toggle speed in DOSBox.'},
    {lbl:'⏯ EMULATOR', txt:'<b>Tab</b> / <b>Esc</b> for in-game menus. Give it a few seconds to boot.'}],

        { title:'Pokémon FireRed', description:'Kanto, remade on GBA', url:'https://archive.org/details/pokemon-fire-red-version_202308', platform:'GBA' },
        { title:'Pokémon Ruby', description:'Hoenn region adventure', url:'https://archive.org/details/pokemon_ruby-version', platform:'GBA' },
        { title:'Pokémon Sapphire', description:'Hoenn region adventure', url:'https://archive.org/details/pokemon-sapphire-version_202308', platform:'GBA' },
        { title:'Pokémon Emerald', description:'The definitive Hoenn journey', url:'https://archive.org/details/pokemon-emerald-version_202308', platform:'GBA' },
        { title:'Grand Theft Auto Advance', description:'Top-down Liberty City on GBA', url:'https://archive.org/details/grand_theft-auto-advance', platform:'GBA' },
        { title:'Mario Kart: Super Circuit', description:'GBA kart racing', url:'https://archive.org/details/mario-kart-super-circuit_gba', platform:'GBA' },
        { title:'GBA Minecraft (gbacraft)', description:'Blocky GBA homebrew', url:'https://archive.org/details/gbacraft', platform:'GBA' }
  ]},
};

/* ================================================================
   STATE
   ================================================================ */
let currentSystem = null;
let displayList = [];     // original indices in displayed order (fixes keyboard desync)
let cursor = 0;           // selection index into displayList
let activePlatform = 'ALL';
let favorites = {};
let audioCtx = null, soundOn = true;

/* ---- cover art: derive archive.org thumbnail from the item URL ---- */
function arcId(url){
  const m = /archive\.org\/(?:details|embed)\/([^/?#]+)/.exec(url||'');
  return m ? m[1] : null;
}
function coverFor(url){
  const id = arcId(url);
  return id ? 'https://archive.org/services/img/'+id : null;
}

/* ---- favorites (localStorage, guarded for SL/CEF) ---- */
function loadFavs(){ try{ const s=localStorage.getItem('sinisterArcadeFavs'); if(s) favorites=JSON.parse(s);}catch(e){} }
function saveFavs(){ try{ localStorage.setItem('sinisterArcadeFavs', JSON.stringify(favorites)); }catch(e){} }
function favKey(s,i){ return s+'::'+SYSTEMS[s].games[i].title; }  // title-keyed = stable if list reorders
function isFav(s,i){ return !!favorites[favKey(s,i)]; }
function toggleFav(s,i){ const k=favKey(s,i); favorites[k]?delete favorites[k]:favorites[k]=1; saveFavs(); renderLibrary(); }

/* ---- audio ---- */
function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f1,f2,dur,vol){ if(!soundOn) return; try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.connect(g); g.connect(c.destination); o.type='square';
  o.frequency.setValueAtTime(f1,c.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
  g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+dur);
  o.start(); o.stop(c.currentTime+dur);}catch(e){} }
const beep=()=>tone(760,0,.08,.08), select=()=>tone(560,880,.14,.13), coin=()=>tone(988,1319,.2,.16);

/* ================================================================
   HOME
   ================================================================ */
function renderOriginals(){
  const rail=document.getElementById('origRail');
  rail.innerHTML='';
  ORIGINALS.forEach(o=>{
    const card=document.createElement('div');
    card.className='orig-card'+(o.ready?'':' soon')+(o.cover?' has-cover':'');
    const art = o.cover
      ? `<img class="orig-cover" src="${o.cover}" alt="" onerror="this.outerHTML='${o.icon}'">`
      : o.icon;
    card.innerHTML=`
      <span class="badge">${o.ready?'ORIGINAL':'SOON'}</span>
      <div class="art">${art}</div>
      <div class="meta"><div class="t">${o.title}</div><div class="d">${o.desc}</div></div>`;
    if(o.ready){
      card.tabIndex=0;
      card.addEventListener('mouseenter',beep);
      const go=()=>launch(o.url,'gameboy',o.title,true);
      card.addEventListener('click',go);
      card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    }
    rail.appendChild(card);
  });
}

function renderSystems(){
  const grid=document.getElementById('sysGrid');
  grid.innerHTML='';
  Object.keys(SYSTEMS).forEach(key=>{
    const s=SYSTEMS[key];
    const c=document.createElement('div');
    c.className='cart'; c.tabIndex=0; c.style.setProperty('--tint',s.tint);
    c.innerHTML=`<div class="ic">${s.icon}</div><div class="nm">${s.name}</div><div class="ct">${s.games.length} title${s.games.length===1?'':'s'}</div>`;
    const open=()=>openSystem(key);
    c.addEventListener('click',open);
    c.addEventListener('mouseenter',beep);
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    grid.appendChild(c);
  });
}

/* ================================================================
   LIBRARY
   ================================================================ */
function openSystem(key){
  select();
  currentSystem=key; activePlatform='ALL'; cursor=0;
  const s=SYSTEMS[key];
  document.getElementById('home').style.display='none';
  document.getElementById('library').classList.add('active');
  document.getElementById('libTitle').textContent=s.name;

  // platform tabs (Game Boy family)
  const tabs=document.getElementById('platTabs');
  if(s.platforms){
    tabs.classList.add('show'); tabs.innerHTML='';
    ['ALL',...s.platforms].forEach(p=>{
      const t=document.createElement('div');
      t.className='tab'+(p==='ALL'?' on':''); t.textContent=p;
      t.onclick=()=>{ activePlatform=p; cursor=0;
        tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.textContent===p));
        renderLibrary(); beep(); };
      tabs.appendChild(t);
    });
  } else { tabs.classList.remove('show'); tabs.innerHTML=''; }

  renderLibrary();
  window.scrollTo(0,0);
}

function renderLibrary(){
  const s=SYSTEMS[currentSystem];
  const grid=document.getElementById('gamesGrid');
  grid.innerHTML='';

  // build [{game, i}] filtered by platform, favorites first
  let rows=s.games.map((g,i)=>({g,i}))
    .filter(r=> activePlatform==='ALL' || !r.g.platform || r.g.platform===activePlatform);
  rows.sort((a,b)=>{
    const af=isFav(currentSystem,a.i), bf=isFav(currentSystem,b.i);
    return af===bf?0:(af?-1:1);
  });

  displayList = rows.map(r=>r.i);            // <-- keyboard nav uses THIS order now
  document.getElementById('libCount').textContent = rows.length+' loaded';

  if(rows.length===0){
    grid.innerHTML=`<div class="empty"><div class="big">Cabinet's empty</div>
      <div class="sub">No cartridges here yet — drop a { title, description, url } into the <b>${s.name}</b> array.</div></div>`;
    return;
  }

  rows.forEach((r,di)=>{
    const {g,i}=r;
    const cov=coverFor(g.url);
    const el=document.createElement('div');
    el.className='game'+(di===cursor?' sel':'')+(isFav(currentSystem,i)?' fav':'');
    el.title=g.description||'';
    el.innerHTML=`
      <div class="cover${cov?'':' noimg'}">
        ${cov?`<img class="cover-img" loading="lazy" alt="" src="${cov}" onerror="this.closest('.cover').classList.add('noimg')">`:''}
        <div class="cover-fallback"><span class="fi">${s.icon}</span></div>
        <span class="star" title="Favorite">${isFav(currentSystem,i)?'★':'☆'}</span>
        ${g.platform?`<span class="plat">${g.platform}</span>`:''}
      </div>
      <div class="info"><div class="gt">${g.title}</div></div>`;
    el.querySelector('.star').addEventListener('click',ev=>{ev.stopPropagation();toggleFav(currentSystem,i);});
    el.addEventListener('click',()=>launchFromDisplay(di));
    el.addEventListener('mouseenter',()=>{beep();cursor=di;syncSel();});
    grid.appendChild(el);
  });
}

function syncSel(){
  document.querySelectorAll('#gamesGrid .game').forEach((el,i)=>el.classList.toggle('sel',i===cursor));
}

function backToSystems(){
  beep();
  document.getElementById('library').classList.remove('active');
  document.getElementById('home').style.display='';
  currentSystem=null;
  window.scrollTo(0,0);
}

/* ================================================================
   LAUNCH / SCREEN
   ================================================================ */
function launchFromDisplay(di){
  const i=displayList[di]; if(i===undefined) return;
  const g=SYSTEMS[currentSystem].games[i];
  launch(g.url, currentSystem, g.title, false);
}

function launch(url, sysForControls, title, isOriginal){
  if(!url){ return; }
  coin();
  currentSystem=sysForControls;
  document.getElementById('library').classList.remove('active');
  document.getElementById('home').style.display='none';
  document.getElementById('screen').classList.add('active');
  document.getElementById('gameFrame').src=url;
  // auto-peek controls for archive.org emulated games only
  if(!isOriginal){
    setTimeout(()=>{ openControls(sysForControls); setTimeout(closeControls,5000); },600);
  }
}

function exitGame(){
  beep();
  document.getElementById('screen').classList.remove('active');
  document.getElementById('gameFrame').src='';
  closeControls();
  if(currentSystem && SYSTEMS[currentSystem]){
    document.getElementById('library').classList.add('active');
  } else {
    document.getElementById('home').style.display='';
  }
}

/* ================================================================
   CONTROLS OVERLAY
   ================================================================ */
function openControls(sys){
  const list=CTRL[sys]; if(!list) return;
  document.getElementById('ctrlTitle').textContent=(SYSTEMS[sys]?SYSTEMS[sys].name:'')+' CONTROLS';
  document.getElementById('ctrlBody').innerHTML=list.map(c=>
    `<div class="cseg"><div class="lbl">${c.lbl}</div><div class="txt">${c.txt}</div></div>`).join('');
  document.getElementById('controls').classList.add('show');
}
function closeControls(){ document.getElementById('controls').classList.remove('show'); }

/* ================================================================
   KEYBOARD
   ================================================================ */
document.addEventListener('keydown',e=>{
  const ctrlOpen=document.getElementById('controls').classList.contains('show');
  const screenOpen=document.getElementById('screen').classList.contains('active');
  const libOpen=document.getElementById('library').classList.contains('active');

  if(ctrlOpen && e.key==='Escape'){ e.preventDefault(); return closeControls(); }
  if(screenOpen){ if(e.key==='Escape'){ e.preventDefault(); exitGame(); } return; }

  if(libOpen){
    if(e.key==='ArrowDown'){ e.preventDefault(); cursor=Math.min(displayList.length-1,cursor+1); syncSel(); scrollToSel(); beep(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cursor=Math.max(0,cursor-1); syncSel(); scrollToSel(); beep(); }
    else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); launchFromDisplay(cursor); }
    else if(e.key==='Escape'){ e.preventDefault(); backToSystems(); }
  }
});
function scrollToSel(){
  const el=document.querySelectorAll('#gamesGrid .game')[cursor];
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ================================================================
   BOOT
   ================================================================ */
loadFavs();
renderOriginals();
renderSystems();
</script>
</body>
</html>
