        /* =====================================================
           📺 VHS EFFECTS - CUSTOMIZE INTENSITY
           ===================================================== */
        /* VHS SCANLINES - STATIC ONLY */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,  /* ← Scanline darkness (0.15 = 15% dark) */
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 3px
            );
            pointer-events: none;
            z-index: 1000;
            animation: flicker 0.15s infinite;  /* ← Flicker speed */
        }
        
        /* REMOVED VHS TRACKING NOISE - was causing moving gradient */
        
        @keyframes flicker {
            0%, 100% { opacity: 0.97; }
            50% { opacity: 1; }
        }
        
        @keyframes pulse-neon {
            0%, 100% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff; }
            50% { text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff, 0 0 50px #ff00ff; }
        }
        
        @keyframes slide-in {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* =====================================================
           📝 HEADER TEXT - CUSTOMIZE TITLE & COLORS
           ===================================================== */
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);  /* ← Header background darkness */
            border: 3px solid;
            border-image: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff) 1;  /* ← Border gradient colors */
            position: relative;
            flex-shrink: 0;  /* ← Don't shrink the header */
        }
        
        .header h1 {
            font-size: 16px;  /* ← Was 14px */
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);  /* ← Title colors */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            animation: pulse-neon 2s infinite;
            filter: drop-shadow(0 0 8px #ff00ff);
        }
        
        .header p {
            font-size: 7px;  /* ← Was 6px */
            color: #00ffff;  /* ← Subtitle color */
            margin-top: 8px;
            text-shadow: 0 0 5px #00ffff;
        }
        
        /* =====================================================
           🎮 SYSTEM BOXES - CUSTOMIZE COLORS & HOVER EFFECTS
           ===================================================== */
        #system-select {
            display: block;
            flex: 1;  /* ← Grow to fill remaining space */
            overflow: hidden;  /* ← Contain the scrollable grid */
        }
        
        #system-select.hidden {
            display: none;
        }
        
        .systems-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);  /* ← 3 columns */
            grid-auto-rows: min-content;  /* ← Rows fit content, no overlap */
            gap: 10px;  /* ← Space between system boxes */
            height: 100%;  /* ← Fill parent (system-select) */
            overflow-y: auto;  /* ← Scrollable */
            padding-right: 5px;
            align-content: start;  /* ← Start from top, don't stretch */
        }
        
        /* Scrollbar for systems grid */
        .systems-grid::-webkit-scrollbar {
            width: 8px;
        }
        
        .systems-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }
        
        .systems-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff00ff, #00ffff);
            border-radius: 4px;
        }
        
        .system-box {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.9);  /* ← Box background 90% opaque */
            border: 2px solid #333;  /* ← Default border color */
            padding: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            animation: slide-in 0.4s ease-out backwards;
        }
        
        /* Stagger animation delays for each box */
        .system-box:nth-child(1) { animation-delay: 0.1s; }
        .system-box:nth-child(2) { animation-delay: 0.15s; }
        .system-box:nth-child(3) { animation-delay: 0.2s; }
        .system-box:nth-child(4) { animation-delay: 0.25s; }
        .system-box:nth-child(5) { animation-delay: 0.3s; }
        .system-box:nth-child(6) { animation-delay: 0.35s; }
        .system-box:nth-child(7) { animation-delay: 0.4s; }
        
        /* Shine effect on hover */
        .system-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .system-box:hover {
            border-color: #ff00ff;  /* ← Hover border color */
            background: rgba(0, 0, 0, 1.0);  /* ← 100% opaque when hovering */
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);  /* ← Brighter hover glow */
            /* Removed transform: scale - box only glows, doesn't resize */
        }
        
        .system-box:hover::before {
            left: 100%;
        }
        
        .system-box.selected {
            border-color: #00ffff;
            background: rgba(0, 0, 0, 1.0);  /* ← 100% opaque when selected */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        
        .system-icon {
            font-size: 28px;  /* ← Icon size */
            text-align: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 5px currentColor);
        }
        
        .system-name {
            font-size: 7px;  /* ← System name size */
            text-align: center;
            color: #fff;
            text-shadow: 0 0 3px #fff;
        }
        
        /* =====================================================
           🎨 SYSTEM COLORS - CUSTOMIZE EACH CONSOLE COLOR
           ===================================================== */
        .nes { color: #e74c3c; }      /* ← NES = Red */

        let selectedSystem = null;
        let selectedGameIndex = 0;
        let soundEnabled = true;  // ← Sound ON by default!
        let audioContext = null;
        
        // Favorites system
        let favorites = {};
        
        // Load favorites from localStorage
        function loadFavorites() {
            try {
                const saved = localStorage.getItem('arcadeFavorites');
                if (saved) {
                    favorites = JSON.parse(saved);
                }
            } catch (e) {
                console.log('Could not load favorites');
            }
        }
        
        // Save favorites to localStorage
        function saveFavorites() {
            try {
                localStorage.setItem('arcadeFavorites', JSON.stringify(favorites));
            } catch (e) {
                console.log('Could not save favorites');
            }
        }
        
        // Toggle favorite status
        function toggleFavorite(systemKey, gameIndex) {
            const key = `${systemKey}-${gameIndex}`;
            if (favorites[key]) {
                delete favorites[key];
            } else {
                favorites[key] = true;
            }
            saveFavorites();
            loadGames(); // Reload to update display
        }
        
        // Check if game is favorite
        function isFavorite(systemKey, gameIndex) {
            const key = `${systemKey}-${gameIndex}`;
            return favorites[key] || false;
        }
        
        // Initialize Web Audio API
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }
        
        // =====================================================
        // 🔊 BEEP SOUND - Menu hover/click
        // Customize: Change frequency for different pitch
        // =====================================================
        function playBeep() {
            if (!soundEnabled) return;
            const ctx = initAudio();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = 800;  // ← Change pitch (Hz)
            oscillator.type = 'square';  // ← Wave type: 'square', 'sine', 'sawtooth', 'triangle'
            
            gainNode.gain.setValueAtTime(0.1, ctx.currentTime);  // ← Volume
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.1);  // ← Duration (seconds)
        }
        
        // =====================================================
        // 🎯 SELECT SOUND - Choosing system/game
        // Customize: Change start/end frequencies for sweep
        // =====================================================
        function playSelect() {
            if (!soundEnabled) return;
            const ctx = initAudio();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.setValueAtTime(600, ctx.currentTime);  // ← Start pitch
            oscillator.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);  // ← End pitch
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.15, ctx.currentTime);  // ← Volume
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.15);  // ← Duration
        }
        
        // =====================================================
        // 💰 COIN SOUND - Game launch (INSERT COIN!)
        // Customize: Change the two frequencies for different tones
        // =====================================================
        function playCoin() {
            if (!soundEnabled) return;
            const ctx = initAudio();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.setValueAtTime(988, ctx.currentTime);  // ← First tone
            oscillator.frequency.setValueAtTime(1319, ctx.currentTime + 0.1);  // ← Second tone
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.2, ctx.currentTime);  // ← Volume
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.2);  // ← Duration
        }
        
        // =====================================================
        // 🎮 SYSTEM CODE - MENU & NAVIGATION LOGIC
        // You probably don't need to change anything below!
        // =====================================================
        
        function showControls(systemKey) {
            const system = SYSTEMS[systemKey];
            const overlay = document.getElementById('controls-overlay');
            const title = document.getElementById('controls-system-name');
            const content = document.getElementById('controls-text');
            
            title.textContent = `${system.name} CONTROLS`;
            content.innerHTML = system.controls;
            overlay.classList.add('active');
        }
        
        function showControlsForCurrentSystem() {
            if (selectedSystem) {
                showControls(selectedSystem);
            }
        }
        
        function closeControls() {
            document.getElementById('controls-overlay').classList.remove('active');
        }
        
        function showControlsButton() {
            document.getElementById('controlsBtn').style.display = 'inline-block';
        }
        
        function hideControlsButton() {
            document.getElementById('controlsBtn').style.display = 'none';
        }
        
        function initSystemSelect() {
            const grid = document.getElementById('systemsGrid');
            grid.innerHTML = '';
            
            Object.keys(SYSTEMS).forEach(systemKey => {
                const system = SYSTEMS[systemKey];
                const box = document.createElement('div');
                box.className = `system-box ${systemKey}`;
                box.innerHTML = `
                    <div class="system-icon">${system.icon}</div>
                    <div class="system-name">${system.name}</div>
                `;
                box.onclick = () => selectSystem(systemKey);
                grid.appendChild(box);
                
                // Add hover sound
                box.addEventListener('mouseenter', () => playBeep());
            });
        }
        
        function selectSystem(systemKey) {
            playSelect(); // Play select sound
            selectedSystem = systemKey;
            const system = SYSTEMS[systemKey];
            
            if (system.games.length === 0) {
                alert('No games available for this system yet! Add some in the GAME DATABASE section!');
                return;
            }
            
            document.getElementById('system-select').classList.add('hidden');
            document.getElementById('game-list').classList.add('active');
            
            loadGames();
            showControlsButton();
            
            // Show controls guide
            showControls(systemKey);
        }
        
        function loadGames() {
            const container = document.getElementById('gamesContainer');
            const system = SYSTEMS[selectedSystem];
            container.innerHTML = '';
            selectedGameIndex = 0;
            
            // Sort games: favorites first
            const gamesWithIndex = system.games.map((game, index) => ({ game, index }));
            gamesWithIndex.sort((a, b) => {
                const aFav = isFavorite(selectedSystem, a.index);
                const bFav = isFavorite(selectedSystem, b.index);
                if (aFav && !bFav) return -1;
                if (!aFav && bFav) return 1;
                return 0; // Keep original order within groups
            });
            
            gamesWithIndex.forEach(({ game, index }, displayIndex) => {
                const item = document.createElement('div');
                item.className = 'game-item';
                if (displayIndex === 0) item.classList.add('selected');
                if (isFavorite(selectedSystem, index)) item.classList.add('favorite');
                
                const star = isFavorite(selectedSystem, index) ? '⭐' : '☆';
                
                item.innerHTML = `
                    <span class="favorite-star" onclick="event.stopPropagation(); toggleFavorite('${selectedSystem}', ${index})">${star}</span>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-desc">${game.description}</div>
                    </div>
                `;
                
                item.onclick = () => playGame(index);
                container.appendChild(item);
                
                // Add hover sound to games
                item.addEventListener('mouseenter', () => playBeep());
            });
        }
        
        function playGame(index) {
            playCoin(); // INSERT COIN!
            const system = SYSTEMS[selectedSystem];
            const game = system.games[index];
            
            // Hide game list, show game screen
            document.getElementById('game-list').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            // Load game in iframe
            const iframe = document.getElementById('game-iframe');
            iframe.src = game.url;
            
            // AUTO-SHOW CONTROLS for 5 seconds when game loads
            setTimeout(() => {
                showControlsForCurrentSystem();
                // Auto-close after 5 seconds
                setTimeout(() => {
                    closeControls();
                }, 5000);
            }, 500);
        }
        
        function backToGameList() {
            playBeep();
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('game-list').classList.add('active');
            document.getElementById('game-iframe').src = '';
        }
        
        function backToSystems() {
            playBeep();
            document.getElementById('game-list').classList.remove('active');
            document.getElementById('system-select').classList.remove('hidden');
            hideControlsButton();
            selectedSystem = null;
        }
        
        // =====================================================
        // ⌨️ KEYBOARD NAVIGATION
        // =====================================================
        document.addEventListener('keydown', (e) => {
            const gameList = document.getElementById('game-list');
            const gameScreen = document.getElementById('game-screen');
            const controlsOverlay = document.getElementById('controls-overlay');
            
            // ESC closes controls overlay if it's open
            if (controlsOverlay.classList.contains('active') && e.key === 'Escape') {
                e.preventDefault();
                closeControls();
                return;
            }
            
            if (gameScreen.classList.contains('active')) {
                // In game screen - ESC to go back
                if (e.key === 'Escape') {
                    e.preventDefault();
                    backToGameList();
                }
            } else if (gameList.classList.contains('active')) {
                // In game list
                const system = SYSTEMS[selectedSystem];
                const items = document.querySelectorAll('.game-item');
                
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedGameIndex = Math.max(0, selectedGameIndex - 1);
                    updateSelection(items);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedGameIndex = Math.min(system.games.length - 1, selectedGameIndex + 1);
                    updateSelection(items);
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    playGame(selectedGameIndex);
                } else if (e.key === 'Escape') {
                    backToSystems();
                }
            }
        });
        
        function updateSelection(items) {
            items.forEach((item, i) => {
                item.classList.toggle('selected', i === selectedGameIndex);
            });
            items[selectedGameIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        
        // =====================================================
        // 🚀 INITIALIZE THE ARCADE!
        // =====================================================
        loadFavorites();
        initSystemSelect();
    </script>
